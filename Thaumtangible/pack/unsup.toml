[flavor_groups.mousetweaks]
name = "Mouse Tweaks"
description = "Tweaks mouse click functionality for better QoL. Allows drag-stacking, shift-click-pickupping, shift-click inventory switching and scroll inventory switching. Client only."
side = "client"
[[flavor_groups.mousetweaks.choices]]
id = "mousetweaks_on"
name = "Yes"
description = "Installs Mouse Tweaks."
[[flavor_groups.mousetweaks.choices]]
id = "mousetweaks_off"
name = "No"
description = "Do not install Mouse Tweaks."

[flavor_groups.inventorytweaks]
name = "Inventory Tweaks"
description = "Allows sorting of inventories and - if enabled - automatic replacment of items and tools with similar items. Preconfigured to not autoreplace. Client with additional functionality on server, but not required on either."
side = "both"
[[flavor_groups.inventorytweaks.choices]]
id = "inventorytweaks_on"
name = "Yes"
description = "Installs Inventory Tweaks."
[[flavor_groups.inventorytweaks.choices]]
id = "inventorytweaks_off"
name = "No"
description = "Do not install Inventory Tweaks."

[flavor_groups.craftingtweaks]
name = "Crafting Tweaks"
description = "Extra buttons for quickly clearing, rotating, balancing and splitting items in the crafting grid. Client with additional functionality on server, but not required on either."
side = "both"
[[flavor_groups.craftingtweaks.choices]]
id = "craftingtweaks_on"
name = "Yes"
description = "Installs Crafting Tweaks."
[[flavor_groups.craftingtweaks.choices]]
id = "craftingtweaks_off"
name = "No"
description = "Do not install Crafting Tweaks."

[flavor_groups.ears]
name = "Ears"
description = "Uses the otherwise-blank space on a modern 64x64 skin in combination with alpha layer encoding to give extra features to your player model, such as ears, wings, a custom cape, breasts, a snout and more. Backports modern skins, but breaks the texture of player head blocks. Client only. No effect (other than seeing other players Ears skins) if you do not have an Ears skin."
side = "client"
[[flavor_groups.ears.choices]]
id = "ears_on"
name = "Yes"
description = "Installs Ears."
[[flavor_groups.ears.choices]]
id = "ears_off"
name = "No"
description = "Do not install Ears."

[flavor_groups.dynsurr]
name = "Dynamic Surroundings"
description = "Adds various sounds based on what you are doing and what is happening around and to you as well as an aurora in the sky at night. Can also be used to block out *any* sound. Comes preconfigured to not be so... intense. Client only."
side = "client"
[[flavor_groups.dynsurr.choices]]
id = "dynsurr_on"
name = "Yes"
description = "Installs Dynamic Surroundings."
[[flavor_groups.dynsurr.choices]]
id = "dynsurr_off"
name = "No"
description = "Do not install Dynamic Surroundings."

[flavor_groups.reauth]
name = "ReAuth"
description = "Allows reauthenticating without restarting the instance, fixing failed authentication bugs. Client only."
side = "client"
[[flavor_groups.reauth.choices]]
id = "reauth_on"
name = "Yes"
description = "Installs ReAuth."
[[flavor_groups.reauth.choices]]
id = "reauth_off"
name = "No"
description = "Do not install ReAuth."

[metafile.mousetweaks]
flavors = "mousetweaks_on"
[metafile.inventory-tweaks]
flavors = "inventorytweaks_on"
[metafile.crafting-tweaks]
flavors = "craftingtweaks_on"
[metafile.ears]
flavors = ["ears_on"]
[metafile.dynamic-surroundings]
flavors = ["dynsurr_on"]
[metafile.reauth]
flavors = "reauth_on"